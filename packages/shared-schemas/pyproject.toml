[project]
name = "dungeoncore-shared-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas for DungeonCore."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
