[project]
name = "dungeoncore-shared-config"
version = "0.1.0"
description = "Shared configuration and infrastructure primitives for DungeonCore."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pika>=1.3,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<8.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
