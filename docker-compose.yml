name: dungeoncore

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SERVICE_NAME: api-gateway
      PORT: ${API_PORT:-8000}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://dungeoncore:dungeoncore@postgres:5432/dungeoncore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dungeoncore:dungeoncore@rabbitmq:5672/}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-lmstudio}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-https://example-resource.services.ai.azure.com}
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-replace-me}
      AZURE_AI_FOUNDRY_MODEL_NAME: ${AZURE_AI_FOUNDRY_MODEL_NAME:-gpt-4}
      WEBSOCKET_BASE_URL: ${WEBSOCKET_BASE_URL:-ws://localhost:8000/ws}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      SERVICE_NAME: orchestrator
      PORT: ${ORCHESTRATOR_PORT:-8001}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://dungeoncore:dungeoncore@postgres:5432/dungeoncore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dungeoncore:dungeoncore@rabbitmq:5672/}
      WEBSOCKET_BASE_URL: ${WEBSOCKET_BASE_URL:-ws://localhost:8000/ws}
    ports:
      - "${ORCHESTRATOR_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent-runtime:
    build:
      context: .
      dockerfile: services/agent-runtime/Dockerfile
    environment:
      SERVICE_NAME: agent-runtime
      PORT: ${AGENT_RUNTIME_PORT:-8002}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://dungeoncore:dungeoncore@postgres:5432/dungeoncore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dungeoncore:dungeoncore@rabbitmq:5672/}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-lmstudio}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234}
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-https://example-resource.services.ai.azure.com}
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-replace-me}
      AZURE_AI_FOUNDRY_MODEL_NAME: ${AZURE_AI_FOUNDRY_MODEL_NAME:-gpt-4}
      WEBSOCKET_BASE_URL: ${WEBSOCKET_BASE_URL:-ws://localhost:8000/ws}
    ports:
      - "${AGENT_RUNTIME_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  game-engine:
    build:
      context: .
      dockerfile: services/game-engine/Dockerfile
    environment:
      SERVICE_NAME: game-engine
      PORT: ${GAME_ENGINE_PORT:-8003}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://dungeoncore:dungeoncore@postgres:5432/dungeoncore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dungeoncore:dungeoncore@rabbitmq:5672/}
      WEBSOCKET_BASE_URL: ${WEBSOCKET_BASE_URL:-ws://localhost:8000/ws}
    ports:
      - "${GAME_ENGINE_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  communication-service:
    build:
      context: .
      dockerfile: services/communication-service/Dockerfile
    environment:
      SERVICE_NAME: communication-service
      PORT: ${COMMUNICATION_SERVICE_PORT:-8004}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://dungeoncore:dungeoncore@postgres:5432/dungeoncore}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dungeoncore:dungeoncore@rabbitmq:5672/}
      WEBSOCKET_BASE_URL: ${WEBSOCKET_BASE_URL:-ws://localhost:8000/ws}
    ports:
      - "${COMMUNICATION_SERVICE_PORT:-8004}:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dungeoncore}
      POSTGRES_USER: ${POSTGRES_USER:-dungeoncore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dungeoncore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dungeoncore} -d ${POSTGRES_DB:-dungeoncore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dungeoncore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dungeoncore}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

networks:
  default:
    name: dungeoncore
